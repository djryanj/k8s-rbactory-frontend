apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-rbactory-frontend
  namespace: k8s-rbactory
  labels:
    app: k8s-rbactory-frontend
  annotations:
    app.kubernetes.io/priority: "best-effort"
    app.kubernetes.io/sla: "none"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-rbactory-frontend  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: k8s-rbactory-frontend
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      automountServiceAccountToken: false
      
      # InitContainer to generate runtime config
      initContainers:
      - name: config-generator
        image: k8s-rbactory-frontend:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/init-config.sh"]
        env:
        - name: VITE_API_URL
          value: "https://your-backend.example.com/api/v1"
        - name: VITE_FEATURE_CLUSTER_BROWSER
          value: "true"
        - name: VITE_NETLIFY_DEMO
          value: "false"
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # InitContainer needs to write to /runtime-config
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: runtime-config
            mountPath: /runtime-config
      
      # Main container
      containers:
      - name: nginx
        image: k8s-rbactory-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: runtime-config
            mountPath: /runtime-config
            readOnly: true
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /var/run
      
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "preemptible"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
